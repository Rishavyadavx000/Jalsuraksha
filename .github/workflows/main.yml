name: JAL-SURAKSHA Main Verification and Debug APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-lint-build:
    name: JVM tests, structural checks, lint and Kotlin compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Android project source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "tools/verify_test_inventory.py" && -f "app/build.gradle.kts" ]]; then
            project_dir="."
          elif [[ -f "JAL_SURAKSHA_Android/tools/verify_test_inventory.py" && -f "JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
            project_dir="JAL_SURAKSHA_Android"
          else
            zip_file="JAL_SURAKSHA_Android_v0.3.1_GITHUB_READY_SOURCE.zip"
            if [[ ! -f "$zip_file" ]]; then
              echo "::error::Required v0.3.1 source archive not found: $zip_file"
              ls -la
              exit 1
            fi
            mkdir -p .ci-source
            unzip -oq "$zip_file" -d .ci-source
            if [[ -f ".ci-source/JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
              project_dir=".ci-source/JAL_SURAKSHA_Android"
            elif [[ -f ".ci-source/app/build.gradle.kts" ]]; then
              project_dir=".ci-source"
            else
              echo "::error::The source archive does not contain an Android Gradle project."
              find .ci-source -maxdepth 4 -type f | sort | head -200
              exit 1
            fi
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $project_dir"

      - name: Apply missing dashboard pipeline status component
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail
          source_file=".github/ci-overrides/PipelineStatusCard.kt"
          target_file="$PROJECT_DIR/app/src/main/java/com/jalsuraksha/app/ui/screens/PipelineStatusCard.kt"
          test -s "$source_file"
          test -s "$PROJECT_DIR/app/src/main/java/com/jalsuraksha/app/ui/screens/HomeScreen.kt"
          mkdir -p "$(dirname "$target_file")"
          cp "$source_file" "$target_file"
          grep -q 'internal fun PipelineStatusCard(ui: UiSnapshot)' "$target_file"
          echo "Applied PipelineStatusCard.kt to $target_file"
          python3 .github/ci-overrides/patch_status_http401.py "$PROJECT_DIR"

      - name: Apply JAL-SURAKSHA launcher icon
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail
          python3 .github/ci-overrides/apply_launcher_icon.py "$PROJECT_DIR"
          icon_dir="$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          test -s "$icon_dir/ic_launcher_art.png" || test -s "$icon_dir/ic_launcher_art.webp"
          if [[ -s "$icon_dir/ic_launcher_art.png" && -s "$icon_dir/ic_launcher_art.webp" ]]; then
            echo "::error::Duplicate ic_launcher_art drawable resources remain."
            exit 1
          fi
          grep -q '<monochrome' "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Verify JVM and UI test inventory
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: python3 tools/verify_test_inventory.py

      - name: Run offline Kotlin/XML structural checks
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: python3 tools/lint_kt.py .

      - name: Verify ESP32 firmware and Android API contract
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: python3 tools/verify_firmware_contract.py

      - name: Compile, execute JVM tests, and run Android lint
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug compileDebugKotlin

      - name: Upload JVM test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jal-suraksha-v0.3.1-unit-lint-reports
          path: |
            ${{ steps.prepare.outputs.project_dir }}/app/build/reports/
            ${{ steps.prepare.outputs.project_dir }}/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  compose-ui-tests:
    name: Compose UI tests on Android emulator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Android project source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "tools/verify_test_inventory.py" && -f "app/build.gradle.kts" ]]; then
            project_dir="."
          elif [[ -f "JAL_SURAKSHA_Android/tools/verify_test_inventory.py" && -f "JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
            project_dir="JAL_SURAKSHA_Android"
          else
            zip_file="JAL_SURAKSHA_Android_v0.3.1_GITHUB_READY_SOURCE.zip"
            if [[ ! -f "$zip_file" ]]; then
              echo "::error::Required v0.3.1 source archive not found: $zip_file"
              exit 1
            fi
            mkdir -p .ci-source
            unzip -oq "$zip_file" -d .ci-source
            if [[ -f ".ci-source/JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
              project_dir=".ci-source/JAL_SURAKSHA_Android"
            elif [[ -f ".ci-source/app/build.gradle.kts" ]]; then
              project_dir=".ci-source"
            else
              echo "::error::Android project not found in source archive."
              exit 1
            fi
          fi
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $project_dir"

      - name: Apply missing dashboard pipeline status component
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail
          source_file=".github/ci-overrides/PipelineStatusCard.kt"
          target_file="$PROJECT_DIR/app/src/main/java/com/jalsuraksha/app/ui/screens/PipelineStatusCard.kt"
          test -s "$source_file"
          test -s "$PROJECT_DIR/app/src/main/java/com/jalsuraksha/app/ui/screens/HomeScreen.kt"
          mkdir -p "$(dirname "$target_file")"
          cp "$source_file" "$target_file"
          grep -q 'internal fun PipelineStatusCard(ui: UiSnapshot)' "$target_file"
          echo "Applied PipelineStatusCard.kt to $target_file"
          python3 .github/ci-overrides/patch_status_http401.py "$PROJECT_DIR"

      - name: Apply JAL-SURAKSHA launcher icon
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail
          python3 .github/ci-overrides/apply_launcher_icon.py "$PROJECT_DIR"
          icon_dir="$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          test -s "$icon_dir/ic_launcher_art.png" || test -s "$icon_dir/ic_launcher_art.webp"
          if [[ -s "$icon_dir/ic_launcher_art.png" && -s "$icon_dir/ic_launcher_art.webp" ]]; then
            echo "::error::Duplicate ic_launcher_art drawable resources remain."
            exit 1
          fi
          grep -q '<monochrome' "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm

      - name: Run instrumented UI tests
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          working-directory: ${{ steps.prepare.outputs.project_dir }}
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            echo "Gradle project directory: $PWD"
            test -f settings.gradle.kts -o -f settings.gradle
            gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jal-suraksha-v0.3.1-ui-test-reports
          path: |
            ${{ steps.prepare.outputs.project_dir }}/app/build/reports/androidTests/
            ${{ steps.prepare.outputs.project_dir }}/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14

  build-debug-apk:
    name: Build installable Debug APK
    needs:
      - unit-lint-build
      - compose-ui-tests
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Android project source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "tools/verify_test_inventory.py" && -f "app/build.gradle.kts" ]]; then
            project_dir="."
          elif [[ -f "JAL_SURAKSHA_Android/tools/verify_test_inventory.py" && -f "JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
            project_dir="JAL_SURAKSHA_Android"
          else
            zip_file="JAL_SURAKSHA_Android_v0.3.1_GITHUB_READY_SOURCE.zip"
            if [[ ! -f "$zip_file" ]]; then
              echo "::error::Required v0.3.1 source archive not found: $zip_file"
              exit 1
            fi
            mkdir -p .ci-source
            unzip -oq "$zip_file" -d .ci-source
            if [[ -f ".ci-source/JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
              project_dir=".ci-source/JAL_SURAKSHA_Android"
            elif [[ -f ".ci-source/app/build.gradle.kts" ]]; then
              project_dir=".ci-source"
            else
              echo "::error::Android project not found in source archive."
              exit 1
            fi
          fi
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"
          echo "Using Android project: $project_dir"

      - name: Apply missing dashboard pipeline status component
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail
          source_file=".github/ci-overrides/PipelineStatusCard.kt"
          target_file="$PROJECT_DIR/app/src/main/java/com/jalsuraksha/app/ui/screens/PipelineStatusCard.kt"
          test -s "$source_file"
          test -s "$PROJECT_DIR/app/src/main/java/com/jalsuraksha/app/ui/screens/HomeScreen.kt"
          mkdir -p "$(dirname "$target_file")"
          cp "$source_file" "$target_file"
          grep -q 'internal fun PipelineStatusCard(ui: UiSnapshot)' "$target_file"
          echo "Applied PipelineStatusCard.kt to $target_file"
          python3 .github/ci-overrides/patch_status_http401.py "$PROJECT_DIR"

      - name: Apply JAL-SURAKSHA launcher icon
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail
          python3 .github/ci-overrides/apply_launcher_icon.py "$PROJECT_DIR"
          icon_dir="$PROJECT_DIR/app/src/main/res/drawable-nodpi"
          test -s "$icon_dir/ic_launcher_art.png" || test -s "$icon_dir/ic_launcher_art.webp"
          if [[ -s "$icon_dir/ic_launcher_art.png" && -s "$icon_dir/ic_launcher_art.webp" ]]; then
            echo "::error::Duplicate ic_launcher_art drawable resources remain."
            exit 1
          fi
          grep -q '<monochrome' "$PROJECT_DIR/app/src/main/res/mipmap-anydpi-v33/ic_launcher.xml"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Build debug APK
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and write checksum
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk"
          mkdir -p release-artifacts
          cp "$apk" release-artifacts/JAL-SURAKSHA-v0.3.1-debug.apk
          sha256sum release-artifacts/JAL-SURAKSHA-v0.3.1-debug.apk > release-artifacts/SHA256SUMS.txt
          ls -lh release-artifacts/

      - name: Upload installable Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: JAL-SURAKSHA-v0.3.1-debug-apk
          path: ${{ steps.prepare.outputs.project_dir }}/release-artifacts/*
          if-no-files-found: error
          retention-days: 30
          
