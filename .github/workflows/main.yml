name: JAL-SURAKSHA Main Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-lint-build:
    name: Unit tests, static checks, lint and debug compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare Android project source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "tools/verify_test_inventory.py" && -f "app/build.gradle.kts" ]]; then
            project_dir="."
            echo "Android project is already at repository root."
          elif [[ -f "JAL_SURAKSHA_Android/tools/verify_test_inventory.py" && -f "JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
            project_dir="JAL_SURAKSHA_Android"
            echo "Android project found in JAL_SURAKSHA_Android/."
          else
            zip_file="JAL_SURAKSHA_Android_v0.2.0_GITHUB_READY_SOURCE.zip"

            if [[ ! -f "$zip_file" ]]; then
              zip_file="$(find . -maxdepth 1 -type f -name 'JAL_SURAKSHA_Android*_GITHUB_READY_SOURCE.zip' -print -quit || true)"
            fi

            if [[ -z "$zip_file" || ! -f "$zip_file" ]]; then
              echo "::error::Android source folder and GitHub-ready source ZIP were not found."
              echo "Upload the project source folder or the *_GITHUB_READY_SOURCE.zip file to the repository root."
              echo "Root directory contents:"
              ls -la
              exit 1
            fi

            mkdir -p .ci-source
            unzip -oq "$zip_file" -d .ci-source

            if [[ -f ".ci-source/JAL_SURAKSHA_Android/tools/verify_test_inventory.py" && -f ".ci-source/JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
              project_dir=".ci-source/JAL_SURAKSHA_Android"
            elif [[ -f ".ci-source/tools/verify_test_inventory.py" && -f ".ci-source/app/build.gradle.kts" ]]; then
              project_dir=".ci-source"
            else
              echo "::error::ZIP was extracted, but expected Android project files were not found."
              find .ci-source -maxdepth 4 -type f | sort | head -250
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using Android project directory: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Verify test inventory
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/verify_test_inventory.py

      - name: Run offline Kotlin/XML structural checks
        working-directory: ${{ env.PROJECT_DIR }}
        run: python3 tools/lint_kt.py .

      - name: Compile, run JVM tests, and run Android lint
        working-directory: ${{ env.PROJECT_DIR }}
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug compileDebugKotlin

      - name: Upload JVM test and lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-unit-and-lint-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/tests/testDebugUnitTest/
            ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-debug.html
            ${{ env.PROJECT_DIR }}/app/build/reports/lint-results-debug.xml
            ${{ env.PROJECT_DIR }}/app/build/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 14

  compose-ui-tests:
    name: Compose UI tests on Android emulator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare Android project source
        shell: bash
        run: |
          set -euo pipefail

          if [[ -f "tools/verify_test_inventory.py" && -f "app/build.gradle.kts" ]]; then
            project_dir="."
          elif [[ -f "JAL_SURAKSHA_Android/tools/verify_test_inventory.py" && -f "JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
            project_dir="JAL_SURAKSHA_Android"
          else
            zip_file="JAL_SURAKSHA_Android_v0.2.0_GITHUB_READY_SOURCE.zip"

            if [[ ! -f "$zip_file" ]]; then
              zip_file="$(find . -maxdepth 1 -type f -name 'JAL_SURAKSHA_Android*_GITHUB_READY_SOURCE.zip' -print -quit || true)"
            fi

            if [[ -z "$zip_file" || ! -f "$zip_file" ]]; then
              echo "::error::Android project source ZIP/folder was not found."
              ls -la
              exit 1
            fi

            mkdir -p .ci-source
            unzip -oq "$zip_file" -d .ci-source

            if [[ -f ".ci-source/JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
              project_dir=".ci-source/JAL_SURAKSHA_Android"
            elif [[ -f ".ci-source/app/build.gradle.kts" ]]; then
              project_dir=".ci-source"
            else
              echo "::error::Android Gradle project was not found after extraction."
              find .ci-source -maxdepth 4 -type f | sort | head -250
              exit 1
            fi
          fi

          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "Using Android project directory: $project_dir"

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Run instrumented UI tests
        uses: ReactiveCircus/android-emulator-runner@v2.38.0
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            cd "$GITHUB_WORKSPACE/$PROJECT_DIR"
            gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-instrumented-test-reports
          path: |
            ${{ env.PROJECT_DIR }}/app/build/reports/androidTests/connected/
            ${{ env.PROJECT_DIR }}/app/build/outputs/androidTest-results/connected/
          if-no-files-found: warn
          retention-days: 14
          
