name: JAL-SURAKSHA Main Verification

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-lint-build:
    name: Unit tests, static checks, lint and debug compile
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Android project source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "tools/verify_test_inventory.py" && -f "app/build.gradle.kts" ]]; then
            project_dir="."
          elif [[ -f "JAL_SURAKSHA_Android/tools/verify_test_inventory.py" && -f "JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
            project_dir="JAL_SURAKSHA_Android"
          else
            zip_file="$(find . -maxdepth 1 -type f -name '*_GITHUB_READY_SOURCE.zip' -print -quit || true)"
            if [[ -z "$zip_file" || ! -f "$zip_file" ]]; then
              echo "::error::Android source folder and GitHub-ready source ZIP were not found."
              exit 1
            fi
            mkdir -p .ci-source
            unzip -oq "$zip_file" -d .ci-source
            if [[ -f ".ci-source/JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
              project_dir=".ci-source/JAL_SURAKSHA_Android"
            else
              project_dir=".ci-source"
            fi
          fi
          echo "PROJECT_DIR=$project_dir" >> "$GITHUB_ENV"
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The action's default includes the removed legacy "tools" package.
          # Install only platform-tools here; platform/build-tools are pinned below.
          packages: 'platform-tools'
          accept-android-sdk-licenses: true

      - name: Install Android 35 platform and build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Verify test inventory
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: python3 tools/verify_test_inventory.py

      - name: Run offline Kotlin/XML structural checks
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: python3 tools/lint_kt.py .

      - name: Compile, run JVM tests, and run Android lint
        working-directory: ${{ steps.prepare.outputs.project_dir }}
        run: gradle --no-daemon --stacktrace clean testDebugUnitTest lintDebug compileDebugKotlin

      - name: Upload JVM test and lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-unit-and-lint-reports
          path: |
            ${{ steps.prepare.outputs.project_dir }}/app/build/reports/
            ${{ steps.prepare.outputs.project_dir }}/app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

  compose-ui-tests:
    name: Compose UI tests on Android emulator
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare Android project source
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "tools/verify_test_inventory.py" && -f "app/build.gradle.kts" ]]; then
            project_dir="."
          elif [[ -f "JAL_SURAKSHA_Android/tools/verify_test_inventory.py" && -f "JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
            project_dir="JAL_SURAKSHA_Android"
          else
            zip_file="$(find . -maxdepth 1 -type f -name '*_GITHUB_READY_SOURCE.zip' -print -quit || true)"
            if [[ -z "$zip_file" ]]; then
              echo "::error::GitHub-ready Android source ZIP was not found."
              exit 1
            fi
            mkdir -p .ci-source
            unzip -oq "$zip_file" -d .ci-source
            if [[ -f ".ci-source/JAL_SURAKSHA_Android/app/build.gradle.kts" ]]; then
              project_dir=".ci-source/JAL_SURAKSHA_Android"
            else
              project_dir=".ci-source"
            fi
          fi
          echo "project_dir=$project_dir" >> "$GITHUB_OUTPUT"

      - name: Apply Compose UI test import fix
        shell: bash
        env:
          PROJECT_DIR: ${{ steps.prepare.outputs.project_dir }}
        run: |
          set -euo pipefail
          source_file=".github/ci-overrides/PumpPanelTest.kt"
          target_file="$PROJECT_DIR/app/src/androidTest/java/com/jalsuraksha/app/PumpPanelTest.kt"
          test -f "$source_file"
          test -f "$PROJECT_DIR/app/build.gradle.kts"
          mkdir -p "$(dirname "$target_file")"
          cp "$source_file" "$target_file"
          if grep -q '^import androidx.compose.ui.test.assertExists$' "$target_file"; then
            echo "::error::Invalid Compose assertExists import remains in UI test source."
            exit 1
          fi
          grep -q 'rule.onNodeWithText("Pump state unknown").assertExists()' "$target_file"
          echo "Applied corrected PumpPanelTest.kt to $target_file"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
          validate-wrappers: false

      - name: Enable KVM group permissions
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run instrumented UI tests
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: aosp_atd
          arch: x86_64
          profile: pixel_2
          working-directory: ${{ steps.prepare.outputs.project_dir }}
          disable-animations: true
          emulator-boot-timeout: 600
          script: |
            set -euo pipefail
            echo "Gradle project directory: $PWD"
            gradle --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-instrumented-test-reports
          path: |
            ${{ steps.prepare.outputs.project_dir }}/app/build/reports/androidTests/
            ${{ steps.prepare.outputs.project_dir }}/app/build/outputs/androidTest-results/
          if-no-files-found: warn
          retention-days: 14
